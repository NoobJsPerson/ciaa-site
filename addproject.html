<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Project · Board Admin</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, sans-serif;
      color: #102b4e;
      background: #f3f7fb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 2rem 1rem; }
    main { max-width: 760px; margin: 0 auto; }
    h1, h2 { font-family: Sora, Inter, system-ui, sans-serif; }
    h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.4rem); }
    h2 { margin: 0 0 1rem; font-size: 1.25rem; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; }
    .panel {
      padding: clamp(1.1rem, 4vw, 1.75rem);
      background: #fff;
      border: 1px solid #d8e5ef;
      border-radius: 16px;
      box-shadow: 0 12px 36px rgb(16 43 78 / 6%);
    }
    .nav { margin: 0 0 1rem; }
    a { color: #176b83; font-weight: 600; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, textarea, button {
      width: 100%;
      margin-top: .35rem;
      padding: .7rem .8rem;
      border: 1px solid #c8d8e5;
      border-radius: 9px;
      background: #fff;
      color: inherit;
      font: inherit;
    }
    input[type="checkbox"] { width: auto; margin: 0; }
    button { width: auto; border: 0; background: #0b2447; color: #fff; font-weight: 600; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .65; }
    button.secondary { background: #eaf2f7; color: #102b4e; }
    .featured { display: flex; align-items: center; gap: .6rem; font-weight: 500; }
    .status { min-height: 1.5em; margin: .75rem 0 0; font-weight: 600; }
    [hidden] { display: none !important; }
    @media (max-width: 520px) {
      body { padding: 1.25rem .75rem; }
      .topbar { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main>
    <header class="topbar">
      <h1>Submit Project</h1>
      <button id="logout-btn" class="secondary" type="button" hidden>Log out</button>
    </header>
    <p id="msg" class="status" role="status" aria-live="polite"></p>

    <section id="login-box" class="panel" aria-labelledby="login-heading">
      <h2 id="login-heading">Log in</h2>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
      <button id="login-btn" type="button" style="margin-top: 1rem">Log in</button>
    </section>

    <section id="upload-box" class="panel" aria-labelledby="add-project-heading" hidden>
      <h2 id="add-project-heading">Add a project</h2>
      <label for="title">Title</label>
      <input id="title" required>
      <label for="description">Description</label>
      <textarea id="description" rows="4"></textarea>
      <label for="link">Link (optional)</label>
      <input id="link" type="url" placeholder="https://">
      <label for="image">Image (optional)</label>
      <input id="image" type="file" accept="image/*">
      <!-- <label class="featured" for="featured">
        <input id="featured" type="checkbox">
        Featured
      </label> -->
      <button id="add-btn" type="button" style="margin-top: 1rem">Add project</button>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://dwtizibjpkdtcceiggxf.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_MeOXYq_SwsXx-IkyPhGqqQ_jGlxMeS5';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const $ = (id) => document.getElementById(id);
    const say = (text) => { $('msg').textContent = text; };

    function showForSession(session) {
      $('login-box').hidden = !!session;
      $('upload-box').hidden = !session;
      $('logout-btn').hidden = !session;
    }

    // Restores the login after a page refresh and reacts to login/logout
    db.auth.onAuthStateChange((_event, session) => showForSession(session));

    $('login-btn').onclick = async () => {
      say('Logging in…');
      const { error } = await db.auth.signInWithPassword({
        email: $('email').value,
        password: $('password').value,
      });
      say(error ? 'Login failed: ' + error.message : '');
    };

    $('logout-btn').onclick = async () => {
      const { error } = await db.auth.signOut();
      if (error) say('Log out failed: ' + error.message);
    };

    $('add-btn').onclick = async () => {
      const title = $('title').value.trim();
      if (!title) { say('Title is required.'); return; }
      say('Saving…');

      // 1. Upload the image (if any) to Storage and get its public URL
      let image_url = null;
      const file = $('image').files[0];
      if (file) {
        const ext = file.name.split('.').pop();
        const path = `${crypto.randomUUID()}.${ext}`;
        const { error: upErr } = await db.storage.from('project-images').upload(path, file);
        if (upErr) { say('Image upload failed: ' + upErr.message); return; }
        image_url = db.storage.from('project-images').getPublicUrl(path).data.publicUrl;
      }

      // 2. Insert the row. The database rejects this if you are not logged in.
      const { error } = await db.from('projects').insert({
        title,
        description: $('description').value.trim(),
        link: $('link').value.trim() || null,
        image_url,
		// featured: $('featured').checked
      });

      if (error) { say('Could not save: ' + error.message); return; }
      say('Project added!');
      for (const id of ['title', 'description', 'link', 'image']) $(id).value = '';
    };
  </script>
</body>
</html>
