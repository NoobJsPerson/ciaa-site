<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ajouter un Projet · CIAA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <main>
    <header class="topbar">
      <div>
        <h1>Proposer un Projet</h1>
        <p class="hint"><a href="projects.html">&larr; Retour aux projets</a> | <a href="index.html">Accueil</a></p>
      </div>
      <button id="logout-btn" class="secondary" type="button" hidden>Déconnexion</button>
    </header>
    <p id="msg" class="status" role="status" aria-live="polite"></p>

    <section id="login-box" class="panel" aria-labelledby="login-heading">
      <h2 id="login-heading">Connexion requise</h2>
      <p class="hint">Vous devez être connecté avec votre compte membre CIAA pour soumettre un projet.</p>
      <label for="email">Adresse Email</label>
      <input id="email" type="email" autocomplete="username" placeholder="etudiant@ump.ac.ma">
      <label for="password">Mot de passe</label>
      <input id="password" type="password" autocomplete="current-password">
      <button id="login-btn" type="button" style="margin-top: 1rem">Se connecter</button>
      <p class="hint" style="margin-top:1rem">Pas encore de compte ? <a href="signup.html">Inscrivez-vous ici</a>.</p>
    </section>

    <section id="upload-box" class="panel" aria-labelledby="add-project-heading" hidden>
      <h2 id="add-project-heading">Formulaire de soumission de projet</h2>
      <label for="title">Titre du projet *</label>
      <input id="title" required placeholder="Ex: Classification d'images médicales avec CNN">
      <label for="description">Description détaillée</label>
      <textarea id="description" rows="4" placeholder="Problématique abordée, méthodologie employée, technologies et résultats..."></textarea>
      <label for="link">Lien du dépôt GitHub ou Démo en ligne (optionnel)</label>
      <input id="link" type="url" placeholder="https://github.com/...">
      <label for="image">Image d'illustration (optionnel)</label>
      <input id="image" type="file" accept="image/*">
      <button id="add-btn" type="button" style="margin-top: 1.25rem">Soumettre le projet pour validation</button>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://dwtizibjpkdtcceiggxf.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_MeOXYq_SwsXx-IkyPhGqqQ_jGlxMeS5';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const $ = (id) => document.getElementById(id);
    const say = (text, isErr = false) => {
      $('msg').textContent = text;
      $('msg').className = isErr ? 'status error' : 'status success';
    };

    function showForSession(session) {
      $('login-box').hidden = !!session;
      $('upload-box').hidden = !session;
      $('logout-btn').hidden = !session;
    }

    db.auth.onAuthStateChange((_event, session) => showForSession(session));

    $('login-btn').onclick = async () => {
      say('Connexion en cours…');
      const { error } = await db.auth.signInWithPassword({
        email: $('email').value.trim(),
        password: $('password').value,
      });
      if (error) {
        say('Échec de la connexion : ' + error.message, true);
      } else {
        say('Connecté avec succès !');
      }
    };

    $('logout-btn').onclick = async () => {
      const { error } = await db.auth.signOut();
      if (error) say('Échec de la déconnexion : ' + error.message, true);
    };

    $('add-btn').onclick = async () => {
      const title = $('title').value.trim();
      if (!title) { say('Le titre est requis.', true); return; }
      say('Enregistrement en cours…');

      let image_url = null;
      const file = $('image').files[0];
      if (file) {
        const ext = file.name.split('.').pop();
        const path = `${crypto.randomUUID()}.${ext}`;
        const { error: upErr } = await db.storage.from('project-images').upload(path, file);
        if (upErr) { say('Échec upload image : ' + upErr.message, true); return; }
        image_url = db.storage.from('project-images').getPublicUrl(path).data.publicUrl;
      }

      const { error } = await db.from('projects').insert({
        title,
        description: $('description').value.trim(),
        link: $('link').value.trim() || null,
        image_url,
      });

      if (error) { say('Impossible d\'enregistrer : ' + error.message, true); return; }
      say('Projet soumis avec succès ! Il sera examiné par le bureau du CIAA.');
      for (const id of ['title', 'description', 'link', 'image']) $(id).value = '';
    };
  </script>
</body>
</html>
