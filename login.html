<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b2447">
  <title>Connexion · CIAA FSAN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main>
    <header class="brand">
      <span class="brand-mark" aria-hidden="true">CIAA</span>
      <h1>Club IA &amp; Applications</h1>
      <p>Connectez-vous à votre compte membre.</p>
    </header>
    <section class="card" aria-labelledby="login-heading">
      <h2 id="login-heading">Bienvenue</h2>
      <p class="intro">Entrez votre adresse email et votre mot de passe pour continuer.</p>
      <form id="login-form">
        <label for="email">Adresse Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required autofocus placeholder="etudiant@ump.ac.ma">
        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="login-btn" type="submit">Se connecter</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>
    <p class="signup"><a href="signup.html">Pas encore de compte ? Créer un compte</a></p>
    <p class="back"><a href="index.html">&larr; Retour au site principal</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://dwtizibjpkdtcceiggxf.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_MeOXYq_SwsXx-IkyPhGqqQ_jGlxMeS5';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const $ = (id) => document.getElementById(id);
    const destination = new URLSearchParams(window.location.search).get('next') || 'index.html';
    let submitting = false;

    function showStatus(message, kind = 'error') {
      $('status').textContent = message;
      $('status').dataset.kind = kind;
    }

    function continueAfterLogin() {
      window.location.replace(destination);
    }

    db.auth.onAuthStateChange((event, session) => {
      if (session && (event === 'INITIAL_SESSION' || event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED')) {
        continueAfterLogin();
      }
    });

    $('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      if (submitting) return;

      submitting = true;
      $('login-btn').disabled = true;
      showStatus('Connexion en cours…', 'info');

      const { error } = await db.auth.signInWithPassword({
        email: $('email').value.trim(),
        password: $('password').value,
      });

      submitting = false;
      $('login-btn').disabled = false;
      if (error) {
        showStatus('Échec de la connexion : ' + error.message, 'error');
        $('password').focus();
      }
    });
  </script>
</body>
</html>
