<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b2447">
  <title>Inscription · CIAA FSAN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main>
    <header class="brand">
      <span class="brand-mark" aria-hidden="true">CIAA</span>
      <h1>Club IA &amp; Applications</h1>
      <p>Rejoignez la communauté étudiante du CIAA.</p>
    </header>
    <section class="card" aria-labelledby="signup-heading">
      <h2 id="signup-heading">Créer un compte</h2>
      <p class="intro">Inscrivez-vous pour soumettre vos projets et collaborer avec les membres.</p>
      <form id="signup-form">
        <div style="display:flex;gap:10px">
          <div style="flex:1">
            <label for="prenom">Prénom</label>
            <input id="prenom" required placeholder="Ex: Karim">
          </div>
          <div style="flex:1">
            <label for="nom">Nom</label>
            <input id="nom" required placeholder="Ex: Mansouri">
          </div>
        </div>
        <label for="email">Adresse Email institutionnelle</label>
        <input id="email" type="email" autocomplete="username" required placeholder="etudiant@ump.ac.ma">
        <label for="password">Mot de passe (6 caractères min.)</label>
        <input id="password" type="password" autocomplete="new-password" required minlength="6">
        <label for="linkedin">Identifiant LinkedIn (optionnel)</label>
        <input id="linkedin" placeholder="Ex: prenom-nom">
        <button id="signup-btn" type="submit">S'inscrire</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>
    <p class="signup"><a href="login.html">Déjà un compte ? Se connecter</a></p>
    <p class="back"><a href="index.html">&larr; Retour au site principal</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://dwtizibjpkdtcceiggxf.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_MeOXYq_SwsXx-IkyPhGqqQ_jGlxMeS5';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const $ = (id) => document.getElementById(id);
    let submitting = false;

    function showStatus(message, kind = 'error') {
      $('status').textContent = message;
      $('status').dataset.kind = kind;
    }

    $('signup-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      if (submitting) return;

      submitting = true;
      $('signup-btn').disabled = true;
      showStatus('Création de votre compte en cours…', 'info');

      const prenom = $('prenom').value.trim();
      const nom = $('nom').value.trim();
      const email = $('email').value.trim();
      const password = $('password').value;
      const linkedin = $('linkedin').value.trim();

      const { data, error } = await db.auth.signUp({
        email,
        password,
        options: {
          data: {
            prenom,
            nom,
            linkedin_username: linkedin || null
          }
        }
      });

      submitting = false;
      $('signup-btn').disabled = false;

      if (error) {
        showStatus('Échec de l\'inscription : ' + error.message, 'error');
        return;
      }

      showStatus('Compte créé avec succès ! Vérifiez votre boîte email pour valider votre compte.', 'success');
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 2500);
    });
  </script>
</body>
</html>
